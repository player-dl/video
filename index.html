<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Proxy Player (GitHub PoC)</title>
    
    <script src="https://assets-jpcust.jwpsrv.com/libraries/YOUR_JW_PLAYER_KEY.js"></script> 
    
    <style>
        /* ... CSS code wahi rahega ... */
        body { 
            margin: 0; 
            background-color: #000; 
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #player-container { 
            width: 90%; 
            max-width: 1000px; 
            aspect-ratio: 16 / 9; 
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }
        .error-message {
            color: white;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="player-container">
        <div id="video-player"></div>
    </div>

    <script>
        // --- 1. Decoder Function (Base64) ---
        function simpleBase64Decode(encodedString) {
            try {
                return atob(encodedString);
            } catch (e) {
                return null;
            }
        }

        // --- 2. Input Data (Aapki Encrypted ID yahan hai) ---
        // 🚨 Is 'eDgyMDFn' ko apni encoded Dailymotion Video ID (Base64) se badlen.
        const ENCRYPTED_VIDEO_ID = 'k6Iv2S3tUvq6LyE8NRO'; 
        
        // --- 3. Player Loading Function ---
        function loadMinimalPlayer() {
            
            // Decryption
            const decodedId = simpleBase64Decode(ENCRYPTED_VIDEO_ID);
            
            if (!decodedId) {
                document.getElementById('video-player').innerHTML = '<div class="error-message">Error: Video ID not decoded.</div>';
                return;
            }
            
            // Dailymotion Embed URL banana
            const dmEmbedUrl = `https://www.dailymotion.com/embed/video/${decodedId}`;
            
            // JW Player Setup
            if (window.jwplayer) {
                // ✅ Change 2: jwplayer.key ya setup ko omit karna
                jwplayer("video-player").setup({
                    file: dmEmbedUrl, 
                    width: "100%",
                    height: "100%",
                    autostart: true,
                    controls: false,        // Control bar chupa dega
                    displaytitle: false,    // Title chupana
                    mute: true              
                });
            } else {
                 document.getElementById('video-player').innerHTML = '<div class="error-message">Error: JW Player library not loaded. Check CDN link.</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadMinimalPlayer);
    </script>
</body>
</html>
