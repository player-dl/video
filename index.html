<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Proxy Player PoC</title>
    <script src="https://content.jwplatform.com/libraries/YOUR_JW_PLAYER_KEY.js"></script> 
    <style>
        body { margin: 0; background-color: #000; }
        #player-container { 
            width: 100%; 
            max-width: 960px; 
            margin: 50px auto; 
            aspect-ratio: 16 / 9; 
        }
    </style>
</head>
<body>
    <div id="player-container">
        <div id="video-player"></div>
    </div>

    <script>
        // --- 1. Decoder Function ---
        function simpleBase64Decode(encodedString) {
            try {
                // Yeh aapki theme mein use hone wala basic decoding method hai
                return atob(encodedString);
            } catch (e) {
                console.error("Decoding error:", e);
                return null;
            }
        }

        // --- 2. Data Input (Encrypted ID ko yahan define karein) ---
        // 'eDgyMDFn' ko apni encoded ID se badlen
        const ENCRYPTED_VIDEO_ID = 'eDgyMDFn'; 
        
        // --- 3. Player Loading Function ---
        function loadMinimalPlayer() {
            
            // Decryption
            const decodedId = simpleBase64Decode(ENCRYPTED_VIDEO_ID);
            if (!decodedId) {
                document.getElementById('video-player').innerHTML = 'Error: Video ID not found.';
                return;
            }
            
            // Dailymotion Embed URL banana
            const dmEmbedUrl = `https://www.dailymotion.com/embed/video/${decodedId}`;
            
            // JW Player Setup
            if (window.jwplayer) {
                jwplayer("video-player").setup({
                    file: dmEmbedUrl, 
                    width: "100%",
                    height: "100%",
                    autostart: true,
                    // 🛑 Minimal UI / Controls Hide Karne Ke Liye Zaroori Setting 🛑
                    controls: false, // Control bar chupa dega
                    displaytitle: false, // Title chupana
                    mute: true // Autoplay ke liye zaruri ho sakta hai
                });
            } else {
                 document.getElementById('video-player').innerHTML = 'JW Player library not loaded. Check key/CDN.';
            }
        }

        document.addEventListener('DOMContentLoaded', loadMinimalPlayer);
    </script>
</body>
</html>
