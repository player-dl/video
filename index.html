<!DOCTYPE html>
<html>
<head>
    <title>Branding-Free Video.js Player</title>
    <link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet" />
    <style>
        /* Player ko page ke beech mein laane ke liye */
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f0f0f0; }
        .video-container { width: 80%; max-width: 900px; }
    </style>
</head>
<body>

    <div class="video-container">
        <video
            id="my-video"
            class="video-js vjs-default-skin"
            controls
            preload="auto"
            width="100%"
            height="500"
            data-setup="{}"
        >
        </video>
    </div>

    <script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>
    <script src="https://unpkg.com/@videojs/http-streaming@3.7.0/dist/videojs-http-streaming.min.js"></script>

    <script>
        // 1. Aapke Worker ka URL jahan se M3U8 link aayega
        const workerUrl = "https://video-source.ia297945.workers.dev/"; 
        
        // 2. Worker se M3U8 link fetch karna
        fetch(workerUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Worker link fetch failed.');
                }
                return response.text(); // Worker sirf text (M3U8 URL) return karega
            })
            .then(m3u8Url => {
                console.log("Fetched M3U8 URL:", m3u8Url);
                
                // 3. Video.js Player ko initialise karna aur source set karna
                const player = videojs('my-video');
                
                player.src({
                    src: m3u8Url.trim(), // Worker se mila hua M3U8 link
                    type: 'application/x-mpegURL' // HLS/M3U8 format
                });

                player.on('error', function() {
                    console.error('Video playback error. Check M3U8 link and CORS headers.');
                });
            })
            .catch(error => {
                console.error("Could not load video source from Worker:", error);
            });
    </script>

</body>
</html>
